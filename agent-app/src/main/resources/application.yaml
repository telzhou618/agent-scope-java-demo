server:
  port: 8082

spring:
  application:
    name: agent-app

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/agent_demo?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: ${MYSQL_PASSWORD:root}

  data:
    redis:
      host: localhost
      port: 6379

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

  ai:
    dashscope:
      api-key: ${YOKA_DASHSCOPE_API_KEY}

# 三档 Agent 主模型，可用环境变量覆盖
agents:
  flash:
    model: ${AGENT_FLASH_MODEL:qwen3.7-flash}
  plus:
    model: ${AGENT_PLUS_MODEL:qwen3.7-plus}
  max:
    model: ${AGENT_MAX_MODEL:qwen3.7-max}

# MCP Server 连接配置
mcp:
  server:
    url: http://localhost:8081
    endpoint: /mcp
    # 对应 mcp-server 模块的 mcp.server.token，两边同为 MCP_SERVER_TOKEN 环境变量；空串表示服务端不启用校验
    token: ${MCP_SERVER_TOKEN:}

# MyBatis-Plus
mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

# Sa-Token：token 通过 Authorization: Bearer 传递，存 Redis，7 天有效
sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 604800
  is-concurrent: false
  is-read-cookie: false
  is-print: false

# token 计费单价（元 / 百万 token）：usage.price 按模型配置，查不到的模型回落到默认费率
usage:
  input-price-per-million: 6
  output-price-per-million: 24
  price:
    qwen3.7-flash:
      input: 1
      output: 4
    qwen3.7-plus:
      input: 6
      output: 24
    qwen3.7-max:
      input: 24
      output: 96

# 聊天附件存储目录
agent:
  upload:
    dir: ./files-uploads


# 接口分组配置
springdoc:
  group-configs:
    - group: 'agent'
      display-name: 'Agent'
      paths-to-match: '/**'
      packages-to-scan: 'com.example.agent.controller'