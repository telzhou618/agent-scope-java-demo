<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent — 对话</title>
<script>
/* 在首次绘制前定好主题：深色用户刷新时不会先闪一下白屏 */
(() => {
  let dark = false;
  try { dark = localStorage.getItem("agent-ui:theme") === "dark"; } catch (_) {}
  document.documentElement.dataset.theme = dark ? "dark" : "light";
})();
</script>
</head>
<body data-view="chat">
<div id="app"></div>
<script>
/* 首屏前置：侧栏是否收起，避免刷新时闪一下。
   窄屏的侧栏是抽屉，一律从收起状态进入（不沿用宽屏的折叠偏好）。 */
(() => {
  try {
    const narrow = window.matchMedia("(max-width: 900px)").matches;
    const collapsed = narrow || localStorage.getItem("agent-ui:sidebar") === "collapsed";
    document.body.dataset.sidebar = collapsed ? "collapsed" : "open";
  } catch (_) {}
})();
</script>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
