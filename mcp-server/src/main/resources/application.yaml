server:
  port: 8081

spring:
  application:
    name: mcp-server
  ai:
    mcp:
      server:
        enabled: true
        name: mcp-server
        version: 1.0.0
        protocol: STREAMABLE

# 服务端 token 鉴权：空串表示不启用校验（本地开发）；
# 非空时要求请求头 Authorization: Bearer <token>，需与 agent-app 的 mcp.server.token（MCP_SERVER_TOKEN 环境变量）保持一致
mcp:
  server:
    token: ${MCP_SERVER_TOKEN:}